[project]
name = "benchtable"
version = "0.1.0"
description = "Run language models as agents in games and record traces for analysis."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "openai>=1,<2",
    "typer>=0.12,<1",
]

[project.scripts]
benchtable = "benchtable.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchtable"]

[project.entry-points."benchtable.games"]
poker = "benchtable.games.poker.session:PokerGame"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "pyright>=1.1,<2",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["src/benchtable"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
